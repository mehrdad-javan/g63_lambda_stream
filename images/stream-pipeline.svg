<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">Stream Pipeline</text>
  <text x="500" y="56" text-anchor="middle" font-size="14" fill="#555">Source  →  any number of intermediate operations (lazy)  →  one terminal operation (triggers everything)</text>

  <!-- ============ ZONE LABELS ============ -->
  <text x="100" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">1. SOURCE</text>
  <text x="520" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#e65100">2. INTERMEDIATE OPERATIONS  (0 or more, chained)</text>
  <text x="900" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e20">3. TERMINAL (exactly 1)</text>

  <!-- ============ SOURCE ============ -->
  <rect x="20" y="110" width="160" height="150" rx="12" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="100" y="140" text-anchor="middle" font-size="13" fill="#222">List / Set / Array</text>
  <text x="100" y="164" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#222">.stream()</text>
  <text x="100" y="196" text-anchor="middle" font-size="12" fill="#555">Provides the data.</text>
  <text x="100" y="214" text-anchor="middle" font-size="12" fill="#555">The stream does NOT</text>
  <text x="100" y="232" text-anchor="middle" font-size="12" fill="#555">store the data.</text>

  <!-- ============ INTERMEDIATE CONTAINER ============ -->
  <rect x="220" y="110" width="600" height="150" rx="14" fill="#fffde7" stroke="#f9a825" stroke-width="2" stroke-dasharray="8 5"/>

  <!-- op boxes -->
  <rect x="236" y="130" width="120" height="82" rx="10" fill="#fff3c4" stroke="#f9a825" stroke-width="2"/>
  <text x="296" y="158" text-anchor="middle" font-size="14" font-family="Consolas, monospace" font-weight="bold" fill="#222">filter()</text>
  <text x="296" y="180" text-anchor="middle" font-size="11" fill="#555">keep matching</text>
  <text x="296" y="196" text-anchor="middle" font-size="11" fill="#555">elements</text>

  <rect x="376" y="130" width="120" height="82" rx="10" fill="#fff3c4" stroke="#f9a825" stroke-width="2"/>
  <text x="436" y="158" text-anchor="middle" font-size="14" font-family="Consolas, monospace" font-weight="bold" fill="#222">map()</text>
  <text x="436" y="180" text-anchor="middle" font-size="11" fill="#555">transform each</text>
  <text x="436" y="196" text-anchor="middle" font-size="11" fill="#555">element</text>

  <rect x="516" y="130" width="120" height="82" rx="10" fill="#fff3c4" stroke="#f9a825" stroke-width="2"/>
  <text x="576" y="158" text-anchor="middle" font-size="14" font-family="Consolas, monospace" font-weight="bold" fill="#222">sorted()</text>
  <text x="576" y="180" text-anchor="middle" font-size="11" fill="#555">order</text>
  <text x="576" y="196" text-anchor="middle" font-size="11" fill="#555">elements</text>

  <rect x="656" y="130" width="148" height="82" rx="10" fill="#ffffff" stroke="#f9a825" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="730" y="158" text-anchor="middle" font-size="14" font-family="Consolas, monospace" font-weight="bold" fill="#222">limit() ...</text>
  <text x="730" y="180" text-anchor="middle" font-size="11" fill="#555">distinct(), skip(),</text>
  <text x="730" y="196" text-anchor="middle" font-size="11" fill="#555">peek(), flatMap() ...</text>

  <!-- arrows between ops -->
  <line x1="356" y1="171" x2="374" y2="171" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="496" y1="171" x2="514" y2="171" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="636" y1="171" x2="654" y2="171" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- container note -->
  <text x="520" y="236" text-anchor="middle" font-size="12" fill="#555">Each one returns a NEW stream, so we can chain as many as we need.</text>
  <text x="520" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">LAZY: they only describe the work. Nothing is executed yet.</text>

  <!-- ============ TERMINAL ============ -->
  <rect x="840" y="110" width="140" height="150" rx="12" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="910" y="140" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#222">toList()</text>
  <text x="910" y="160" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#222">forEach()</text>
  <text x="910" y="180" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#222">count()</text>
  <text x="910" y="200" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#222">reduce() ...</text>
  <text x="910" y="228" text-anchor="middle" font-size="12" fill="#555">Produces the result</text>
  <text x="910" y="246" text-anchor="middle" font-size="12" fill="#555">and ends the stream.</text>

  <!-- main flow arrows -->
  <line x1="180" y1="171" x2="218" y2="171" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="820" y1="171" x2="838" y2="171" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ============ TRIGGER ARROW ============ -->
  <path d="M910 262 L910 296 L100 296 L100 264" fill="none" stroke="#c62828" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowRed)"/>
  <rect x="300" y="282" width="420" height="28" rx="14" fill="#ffebee" stroke="#c62828"/>
  <text x="510" y="301" text-anchor="middle" font-size="13" font-weight="bold" fill="#c62828">Terminal operation is called: it TRIGGERS the pipeline and pulls the data</text>

  <!-- ============ EXAMPLE ============ -->
  <text x="20" y="346" font-size="15" font-weight="bold" fill="#222">Example: emails of active employees, sorted</text>
  <rect x="20" y="358" width="960" height="44" rx="8" fill="#f5f5f5" stroke="#bbb"/>
  <text x="34" y="386" font-size="14" font-family="Consolas, monospace" fill="#222">employees.stream().filter(Employee::isActive).map(Employee::getEmail).sorted().toList();</text>

  <!-- data row -->
  <g font-size="12" fill="#222" text-anchor="middle">
    <rect x="20" y="420" width="160" height="62" rx="8" fill="#e3f2fd" stroke="#1976d2"/>
    <text x="100" y="442">Cara (active)</text>
    <text x="100" y="458">Ben (inactive)</text>
    <text x="100" y="474">Anna (active)</text>

    <rect x="236" y="420" width="120" height="62" rx="8" fill="#fff3c4" stroke="#f9a825"/>
    <text x="296" y="446">Cara</text>
    <text x="296" y="462">Anna</text>
    <text x="296" y="476" fill="#c62828" font-size="11">Ben removed</text>

    <rect x="376" y="420" width="120" height="62" rx="8" fill="#fff3c4" stroke="#f9a825"/>
    <text x="436" y="446">cara@mail.com</text>
    <text x="436" y="462">anna@mail.com</text>
    <text x="436" y="476" fill="#777" font-size="11">names to emails</text>

    <rect x="516" y="420" width="120" height="62" rx="8" fill="#fff3c4" stroke="#f9a825"/>
    <text x="576" y="446">anna@mail.com</text>
    <text x="576" y="462">cara@mail.com</text>
    <text x="576" y="476" fill="#777" font-size="11">sorted A to Z</text>

    <rect x="840" y="420" width="140" height="62" rx="8" fill="#e8f5e9" stroke="#388e3c"/>
    <text x="910" y="446">List&lt;String&gt;</text>
    <text x="910" y="462">[anna@mail.com,</text>
    <text x="910" y="476">cara@mail.com]</text>
  </g>
  <line x1="180" y1="451" x2="234" y2="451" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="356" y1="451" x2="374" y2="451" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="496" y1="451" x2="514" y2="451" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="636" y1="451" x2="838" y2="451" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- footer -->
  <text x="500" y="520" text-anchor="middle" font-size="13" fill="#555">Without a terminal operation nothing is printed, filtered or mapped: the pipeline is only defined, never executed.</text>
  <text x="500" y="540" text-anchor="middle" font-size="13" fill="#555">Short-circuiting terminals (findFirst, anyMatch) can stop early without processing all elements.</text>
</svg>
